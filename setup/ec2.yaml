AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  fieldtest server. No inbound ports; the setup wizard and dashboard open through an SSM port-forwarding
  session (see the ConnectCommand output).

Parameters:
  InstallName:
    Type: String
    Description: Name of this install (lowercase letters, digits, -). Shown in Slack and the dashboard.
    AllowedPattern: "^[a-z0-9-]{1,32}$"
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the server.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: A subnet with internet access (a default VPC subnet works).
  InstanceType:
    Type: String
    Default: c8g.2xlarge
    Description: Graviton (arm64) instance type. 8 vCPU / 16 GB fits one install.
  LocalPort:
    Type: Number
    Default: 4310
    Description: Port on your computer for the dashboard. Give each install you open at once its own.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id
    Description: Ubuntu 24.04 arm64 (Canonical's public SSM parameter).

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub fieldtest ${InstallName}, outbound only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Role]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SecurityGroup]
          AssociatePublicIpAddress: true
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 100
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > /var/log/fieldtest-install.log 2>&1
          apt-get update -q
          apt-get install -y -q git
          mkdir -p /srv/fieldtest
          git clone https://github.com/immensus-team/fieldtest.git /srv/fieldtest/code
          bash /srv/fieldtest/code/setup/install.sh base --name ${InstallName}
      Tags:
        - Key: Name
          Value: !Sub fieldtest-${InstallName}
        - Key: fieldtest:install
          Value: !Ref InstallName

Outputs:
  InstanceId:
    Value: !Ref Instance
  ConnectCommand:
    Description: Run on your computer (AWS CLI and the Session Manager plugin), then open OpenUrl.
    Value: !Sub >-
      aws ssm start-session --region ${AWS::Region} --target ${Instance}
      --document-name AWS-StartPortForwardingSession
      --parameters '{"portNumber":["4310"],"localPortNumber":["${LocalPort}"]}'
  OpenUrl:
    Value: !Sub http://127.0.0.1:${LocalPort}
  InstallLog:
    Description: The install takes 10 to 15 minutes; the wizard answers when it is done.
    Value: !Sub aws ssm start-session --region ${AWS::Region} --target ${Instance}, then sudo tail -f /var/log/fieldtest-install.log
